<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mumbai Rain · next 2 hours</title>
  <meta name="description" content="Will it rain at your exact Mumbai spot in the next 2 hours? A 2-second verdict — leave now or wait." />
  <meta name="theme-color" content="#14110f" />

  <!-- Display face: Archivo (variable, set wide + heavy for the verdict).
       System fonts carry everything else, so this is the only network font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Rain canvas sits behind everything; intensity is driven by the forecast. -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <main id="app" class="state-loading" aria-live="polite">
    <!-- Location: an eyebrow label + a tap-to-change pill that is the dropdown. -->
    <header class="loc">
      <span class="loc-eyebrow">your spot · now</span>
      <span class="loc-pill">
        <select id="locality" aria-label="Choose your Mumbai area">
          <!-- options injected by app.js -->
        </select>
      </span>
    </header>

    <!-- THE VERDICT — the 2-second answer, dominates the screen. -->
    <section class="hero">
      <h1 id="verdict" class="verdict">Finding your spot…</h1>
      <p id="verdict-sub" class="verdict-sub"></p>
    </section>

    <!-- LEAVE-NOW strip — only shown when rain is incoming. -->
    <p id="leave" class="leave" hidden></p>

    <!-- Quiet detail rows, like a ticket stub under the headline. -->
    <dl class="details">
      <div class="row" id="measured-row">
        <dt>measured now</dt>
        <dd id="measured">—</dd>
      </div>
      <div class="row" id="flood-row" hidden>
        <dt>flood watch</dt>
        <dd id="flood"></dd>
      </div>
    </dl>

    <footer class="foot">
      <p id="honesty" class="honesty">calibrated forecast for your spot</p>
      <p class="attrib"><a href="https://open-meteo.com/" rel="noopener">Weather data by Open-Meteo.com</a></p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
