name: retrain

# Daily: retrain the calibration model on the accumulated diary and promote it IF it
# beats the champion AND the raw forecast on a held-out test. No-ops (skips) until there
# are enough labelled rows, so it's safe to enable now — it just waits for data.
on:
  schedule:
    - cron: "30 1 * * *"     # daily 01:30 UTC (after a night of collection)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Test (never train on broken code)
        run: uv run pytest -q
      - name: Train + eval gate
        run: uv run python -m pipeline.train
      - name: Commit model if promoted
        run: |
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add public/model.json
          git diff --cached --quiet || git commit -m "model: retrain promoted [skip ci]"
          git push
